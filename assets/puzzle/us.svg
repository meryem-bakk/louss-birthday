<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Illustration: the two of us (+ the kitten) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE6EC"/><stop offset=".55" stop-color="#F4E3EF"/><stop offset="1" stop-color="#E7E0F3"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#FFF8F6"/><stop offset="1" stop-color="#FFF8F6" stop-opacity="0"/></radialGradient>
    <symbol id="bloom" viewBox="-40 -40 80 80">
      <g fill="#F2B5C4"><circle cy="-17" r="15"/><circle cx="16" cy="-5" r="15"/><circle cx="10" cy="14" r="15"/><circle cx="-10" cy="14" r="15"/><circle cx="-16" cy="-5" r="15"/></g>
      <circle r="9" fill="#9E5267"/><circle r="4" fill="#F5DDE3"/>
    </symbol>
    <symbol id="daisy" viewBox="-40 -40 80 80">
      <g fill="#FFFFFF" stroke="#EADFD6">
        <ellipse cy="-20" rx="7" ry="18"/><ellipse cy="-20" rx="7" ry="18" transform="rotate(45)"/><ellipse cy="-20" rx="7" ry="18" transform="rotate(90)"/><ellipse cy="-20" rx="7" ry="18" transform="rotate(135)"/>
        <ellipse cy="-20" rx="7" ry="18" transform="rotate(180)"/><ellipse cy="-20" rx="7" ry="18" transform="rotate(225)"/><ellipse cy="-20" rx="7" ry="18" transform="rotate(270)"/><ellipse cy="-20" rx="7" ry="18" transform="rotate(315)"/>
      </g>
      <circle r="10" fill="#F2C14E"/>
    </symbol>
    <symbol id="heart" viewBox="-12 -12 24 24"><path d="M0,9 C-14,-1 -9,-13 0,-6 C9,-13 14,-1 0,9Z"/></symbol>
  </defs>

  <!-- background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="340" fill="url(#halo)"/>
  <g fill="#E9B8C4">
    <use href="#heart" x="92" y="190" width="34" height="34"/>
    <use href="#heart" x="660" y="230" width="44" height="44"/>
    <use href="#heart" x="130" y="300" width="22" height="22" opacity=".7"/>
    <use href="#heart" x="690" y="380" width="24" height="24" opacity=".7"/>
  </g>
  <g fill="#C9B6E4">
    <use href="#heart" x="600" y="150" width="26" height="26"/>
    <use href="#heart" x="70" y="420" width="30" height="30"/>
  </g>
  <g fill="#F2D59B" font-family="Georgia, serif" font-size="26">
    <text x="190" y="190">✦</text><text x="610" y="330">✦</text><text x="120" y="560">✧</text><text x="700" y="520">✧</text>
  </g>
  <text x="400" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="66" fill="#9E5267">you &amp; me ♡</text>

  <!-- ===== LEFT: long dark hair, hoops, leather jacket, big smile ===== -->
  <g transform="rotate(6 300 470)">
    <!-- hair back + ponytail -->
    <ellipse cx="296" cy="335" rx="124" ry="138" fill="#3A2621"/>
    <path d="M186,350 C140,430 150,540 196,610 C214,540 214,450 222,380Z" fill="#3A2621"/>
    <!-- body -->
    <path d="M110,800 C112,628 178,548 300,536 C410,548 456,628 462,800Z" fill="#2E2A2E"/>
    <path d="M300,540 L246,548 L282,640 Z M300,540 L354,548 L318,640 Z" fill="#433D43"/>
    <path d="M262,546 L300,612 L338,546 Z" fill="#FBF7F2"/>
    <path d="M150,700 C170,690 200,690 220,700" stroke="#55505A" stroke-width="3" fill="none"/>
    <!-- neck -->
    <path d="M272,430 L272,540 Q300,562 328,540 L328,430Z" fill="#E9BEA4"/>
    <path d="M268,560 Q300,600 332,560" stroke="#D9B26A" stroke-width="3" fill="none"/>
    <circle cx="300" cy="582" r="6" fill="#D9B26A"/>
    <!-- ear + hoop -->
    <ellipse cx="200" cy="378" rx="13" ry="20" fill="#EFC3A9"/>
    <circle cx="204" cy="410" r="13" fill="none" stroke="#D9B26A" stroke-width="4.5"/>
    <!-- face -->
    <ellipse cx="300" cy="355" rx="100" ry="114" fill="#F3CDB4"/>
    <ellipse cx="244" cy="398" rx="24" ry="13" fill="#F2A0A6" opacity=".55"/>
    <ellipse cx="356" cy="398" rx="24" ry="13" fill="#F2A0A6" opacity=".55"/>
    <!-- hair front -->
    <path d="M194,355 C186,250 248,212 306,212 C368,212 414,256 404,336 C384,290 350,270 296,274 C258,278 222,300 206,358Z" fill="#3A2621"/>
    <path d="M296,274 C270,282 250,300 240,330 C262,300 280,290 300,286Z" fill="#4A322B"/>
    <path d="M404,330 C412,380 404,420 392,450 C394,410 396,375 394,340Z" fill="#3A2621"/>
    <!-- brows -->
    <path d="M240,318 Q262,305 282,314 M318,314 Q338,305 360,318" stroke="#3A2621" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <!-- happy closed eyes -->
    <path d="M244,352 Q262,334 280,352 M320,352 Q338,334 356,352" stroke="#3A2621" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M244,352 L236,348 M356,352 L364,348" stroke="#3A2621" stroke-width="3" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M301,366 Q308,382 296,388" stroke="#D49A85" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- big smile -->
    <path d="M262,404 Q300,452 338,404 Z" fill="#B3465A"/>
    <path d="M266,405 Q300,418 334,405 L331,413 Q300,426 269,413Z" fill="#FFFFFF"/>
    <path d="M286,434 Q300,442 314,434 Q300,430 286,434Z" fill="#E88A96"/>
  </g>

  <!-- ===== RIGHT: dark hijab, freckles, kiss face ===== -->
  <g transform="rotate(-6 505 470)">
    <!-- body -->
    <path d="M352,800 C362,630 420,552 505,546 C600,552 664,630 680,800Z" fill="#4A4650"/>
    <g stroke="#57535E" stroke-width="2.5">
      <path d="M390,690 L392,800 M410,660 L414,800 M600,660 L596,800 M620,690 L618,800"/>
    </g>
    <circle cx="540" cy="690" r="6" fill="#2E2A30"/><circle cx="540" cy="750" r="6" fill="#2E2A30"/>
    <!-- hijab -->
    <path d="M378,360 C372,228 440,180 505,180 C576,180 640,228 634,360 C634,440 612,500 596,540 C570,600 540,640 505,646 C470,640 440,600 414,540 C398,500 378,440 378,360Z" fill="#2E2528"/>
    <!-- face -->
    <ellipse cx="505" cy="352" rx="92" ry="110" fill="#F6D5C2"/>
    <ellipse cx="458" cy="392" rx="22" ry="12" fill="#F29AA2" opacity=".55"/>
    <ellipse cx="552" cy="392" rx="22" ry="12" fill="#F29AA2" opacity=".55"/>
    <!-- hijab front edge & chin wrap -->
    <path d="M412,306 C424,246 466,222 505,222 C548,222 588,246 598,306 C582,276 548,260 505,260 C462,260 428,276 412,306Z" fill="#2E2528"/>
    <path d="M414,404 C428,466 466,490 505,492 C546,490 584,466 596,404 C604,470 566,530 505,536 C444,530 406,470 414,404Z" fill="#3B3135"/>
    <path d="M440,500 C470,520 540,520 570,500 M430,560 C470,590 540,590 580,560" stroke="#493D42" stroke-width="3" fill="none"/>
    <!-- brows -->
    <path d="M448,313 Q470,300 492,309 M518,309 Q540,300 562,313" stroke="#2A1A14" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <!-- eyes -->
    <ellipse cx="470" cy="346" rx="17" ry="12" fill="#FFFFFF"/>
    <ellipse cx="541" cy="346" rx="17" ry="12" fill="#FFFFFF"/>
    <circle cx="471" cy="347" r="9.5" fill="#7A4A30"/><circle cx="542" cy="347" r="9.5" fill="#7A4A30"/>
    <circle cx="471" cy="347" r="4.5" fill="#24150F"/><circle cx="542" cy="347" r="4.5" fill="#24150F"/>
    <circle cx="474" cy="343" r="2.6" fill="#FFFFFF"/><circle cx="545" cy="343" r="2.6" fill="#FFFFFF"/>
    <path d="M451,343 Q470,327 489,340 M522,340 Q541,327 560,343" stroke="#24150F" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M451,343 L444,338 M560,343 L567,338" stroke="#24150F" stroke-width="3" stroke-linecap="round"/>
    <!-- freckles -->
    <g fill="#C98A6E" opacity=".75">
      <circle cx="478" cy="370" r="2"/><circle cx="488" cy="378" r="1.8"/><circle cx="470" cy="380" r="1.6"/><circle cx="460" cy="372" r="1.8"/>
      <circle cx="482" cy="389" r="1.6"/><circle cx="452" cy="384" r="1.5"/><circle cx="520" cy="372" r="2"/><circle cx="530" cy="380" r="1.8"/>
      <circle cx="540" cy="372" r="1.6"/><circle cx="550" cy="381" r="1.8"/><circle cx="524" cy="389" r="1.6"/><circle cx="558" cy="372" r="1.5"/>
      <circle cx="496" cy="366" r="1.4"/><circle cx="514" cy="366" r="1.4"/><circle cx="505" cy="372" r="1.4"/>
    </g>
    <!-- nose -->
    <path d="M506,360 Q514,378 500,384" stroke="#D49A85" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- kiss lips -->
    <path d="M486,414 C489,400 503,403 506,408 C510,402 525,401 526,414 C527,428 512,433 506,433 C499,433 484,428 486,414Z" fill="#D96B7A"/>
    <path d="M490,414 Q506,418 522,414" stroke="#B84E60" stroke-width="2" fill="none"/>
    <ellipse cx="498" cy="423" rx="5" ry="2.5" fill="#FFFFFF" opacity=".5"/>
  </g>

  <!-- ===== the kitten ===== -->
  <g transform="translate(400,690)">
    <ellipse cx="0" cy="58" rx="78" ry="52" fill="#FFFDFB"/>
    <path d="M-44,-36 L-52,-92 L-14,-58Z" fill="#B9B2B6"/><path d="M44,-36 L52,-92 L14,-58Z" fill="#B9B2B6"/>
    <path d="M-40,-44 L-46,-80 L-20,-58Z" fill="#F4C3C9"/><path d="M40,-44 L46,-80 L20,-58Z" fill="#F4C3C9"/>
    <circle cx="0" cy="-10" r="56" fill="#FFFDFB"/>
    <path d="M-54,-26 C-50,-62 -16,-68 0,-56 C16,-68 50,-62 54,-26 C36,-40 16,-40 0,-30 C-16,-40 -36,-40 -54,-26Z" fill="#B9B2B6"/>
    <ellipse cx="-22" cy="-6" rx="10" ry="12" fill="#8DA6A0"/><ellipse cx="22" cy="-6" rx="10" ry="12" fill="#8DA6A0"/>
    <ellipse cx="-22" cy="-5" rx="4" ry="8" fill="#24201F"/><ellipse cx="22" cy="-5" rx="4" ry="8" fill="#24201F"/>
    <circle cx="-19" cy="-10" r="2.6" fill="#FFFFFF"/><circle cx="25" cy="-10" r="2.6" fill="#FFFFFF"/>
    <path d="M-6,12 L6,12 L0,19Z" fill="#F0A1AE"/>
    <path d="M0,19 Q-6,26 -12,22 M0,19 Q6,26 12,22" stroke="#B9A8AA" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-20,14 L-56,8 M-20,20 L-56,24 M20,14 L56,8 M20,20 L56,24" stroke="#CFC6C8" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="-30" cy="96" rx="20" ry="11" fill="#FFFDFB" stroke="#ECE4E2" stroke-width="1.5"/>
    <ellipse cx="30" cy="96" rx="20" ry="11" fill="#FFFDFB" stroke="#ECE4E2" stroke-width="1.5"/>
  </g>

  <!-- flowers in the corners -->
  <use href="#bloom" x="-20" y="650" width="130" height="130"/>
  <use href="#daisy" x="70" y="700" width="96" height="96"/>
  <use href="#daisy" x="640" y="660" width="110" height="110"/>
  <use href="#bloom" x="700" y="720" width="100" height="100"/>
  <use href="#daisy" x="20" y="20" width="80" height="80" opacity=".9"/>
  <use href="#bloom" x="700" y="30" width="80" height="80" opacity=".9"/>
</svg>
